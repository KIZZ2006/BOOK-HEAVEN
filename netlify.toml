[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  DEPLOY_TARGET = "netlify"

[[redirects]]
  from = "/api/*"
  to = "https://yasemin-book-heaven.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
